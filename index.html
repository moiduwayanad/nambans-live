<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nambans Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-center items-center p-4 select-none">

  <!-- JOIN SECTION -->
  <section id="joinBox" class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl space-y-6">
    <div class="flex justify-center">
      <div class="w-40 h-40 rounded-full overflow-hidden border-4 border-green-500 shadow-2xl bg-white p-1">
        <img src="/logo.png" alt="Logo" class="w-full h-full object-cover rounded-full" />
      </div>
    </div>

    <div>
      <h1 class="text-2xl font-black tracking-wide">NAMBANS <span class="text-orange-500">LIVE</span></h1>
      <p class="text-xs text-green-400 font-bold uppercase tracking-wider">Moidu Namban Initiative</p>
    </div>

    <form onsubmit="handleJoin(event)" class="space-y-3">
      <input type="text" id="gamePin" placeholder="Enter Game PIN" maxlength="6" required
        class="w-full text-center text-xl tracking-widest font-black bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" />
      
      <input type="text" id="nickname" placeholder="Enter Your Nickname" maxlength="15" required
        class="w-full text-center text-base font-bold bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-green-500" />
      
      <p id="joinErrMsg" class="text-xs text-red-400 hidden font-semibold"></p>

      <button type="submit" 
        class="w-full py-4 rounded-2xl font-black text-lg text-white bg-gradient-to-r from-green-600 to-green-500 active:scale-95 transition shadow-lg shadow-green-950 cursor-pointer">
        JOIN GAME
      </button>
    </form>
  </section>

  <!-- LOBBY SECTION -->
  <section id="lobbyBox" class="hidden w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl space-y-4">
    <div class="inline-block p-2 px-4 rounded-full bg-green-500/10 border border-green-500 text-green-400 text-xs font-bold">
      Connected to Room
    </div>
    <h2 id="welcomeText" class="text-2xl font-black"></h2>
    <p class="text-slate-400 text-sm animate-pulse">Waiting for admin to start questions...</p>
  </section>

  <!-- PLAYER LIVE QUESTION SCREEN -->
  <section id="playBox" class="hidden w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center space-y-4">
    <div class="w-full flex justify-between items-center pb-2 border-b border-slate-800">
      <span id="playerQIndex" class="text-xs font-bold text-slate-400">Question 1</span>
      <span class="text-xs font-bold text-green-400">LIVE</span>
    </div>

    <!-- Circular Timer for Player -->
    <div class="relative w-20 h-20 flex items-center justify-center">
      <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-slate-800" fill="transparent" />
        <circle id="playerTimerRing" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" 
          stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round" 
          class="text-orange-500 transition-all duration-75" fill="transparent" />
      </svg>
      <span id="playerTimerDigit" class="absolute text-xl font-black text-white font-mono">--</span>
    </div>

    <div id="expireBanner" class="hidden w-full text-center py-2.5 rounded-xl bg-red-950 border border-red-500 text-red-300 font-black text-sm animate-pulse">
      ⌛ TIME'S UP! Question Expired
    </div>

    <div id="playerImgBox" class="hidden flex justify-center w-full">
      <img id="playerQImg" src="" class="max-h-44 rounded-xl border border-slate-700 object-contain shadow">
    </div>

    <h2 id="playerQText" class="text-lg font-bold text-center text-slate-100 min-h-[40px] flex items-center justify-center w-full"></h2>
    
    <div id="playerChoices" class="grid grid-cols-1 gap-3 w-full"></div>
    <p id="submissionState" class="text-xs text-center text-slate-400"></p>
  </section>

  <script>
    const socket = io();
    let hasSubmitted = false;
    let timerInterval = null;
    const circleCircumference = 264;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function handleJoin(e) {
      e.preventDefault();
      audioCtx.resume();
      const pin = document.getElementById('gamePin').value.trim();
      const name = document.getElementById('nickname').value.trim();
      if (!pin || !name) return;
      socket.emit('join_game', { pin, name });
    }

    socket.on('join_error', ({ message }) => {
      const err = document.getElementById('joinErrMsg');
      err.textContent = message;
      err.classList.remove('hidden');
    });

    socket.on('joined_successfully', ({ name }) => {
      document.getElementById('joinBox').classList.add('hidden');
      document.getElementById('lobbyBox').classList.remove('hidden');
      document.getElementById('welcomeText').textContent = `Welcome, ${name}!`;
    });

    socket.on('new_question', (q) => {
      document.getElementById('lobbyBox').classList.add('hidden');
      document.getElementById('playBox').classList.remove('hidden');
      document.getElementById('expireBanner').classList.add('hidden');
      document.getElementById('submissionState').textContent = 'Tap your answer before time runs out!';
      document.getElementById('submissionState').classList.remove('text-red-400');

      document.getElementById('playerQIndex').textContent = `Question ${q.index + 1}/${q.total}`;
      document.getElementById('playerQText').textContent = q.text;

      const imgBox = document.getElementById('playerImgBox');
      if (q.image) {
        document.getElementById('playerQImg').src = q.image;
        imgBox.classList.remove('hidden');
      } else {
        imgBox.classList.add('hidden');
      }

      hasSubmitted = false;
      const choicesBox = document.getElementById('playerChoices');
      choicesBox.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `btn-${idx}`;
        btn.className = "w-full p-4 rounded-2xl bg-slate-800 border-2 border-slate-700 font-bold text-left text-base active:scale-95 transition cursor-pointer";
        btn.textContent = opt;
        btn.onclick = () => submitChoice(idx);
        choicesBox.appendChild(btn);
      });

      const totalMs = q.timeLimit * 1000;
      let lastSec = -1;
      const ring = document.getElementById('playerTimerRing');
      const digit = document.getElementById('playerTimerDigit');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = q.deadline - Date.now();
        const currentSec = Math.max(0, Math.ceil(remaining / 1000));

        digit.textContent = currentSec;

        const ratio = Math.max(0, remaining / totalMs);
        ring.style.strokeDashoffset = circleCircumference * (1 - ratio);

        if (currentSec !== lastSec && currentSec > 0 && !hasSubmitted) {
          playTick();
          lastSec = currentSec;
        }

        if (remaining <= 0) {
          clearInterval(timerInterval);
          ring.style.strokeDashoffset = circleCircumference;
          digit.textContent = '0';
          lockOptionsOnExpiry();
        }
      }, 50);
    });

    function submitChoice(idx) {
      if (hasSubmitted) return;
      hasSubmitted = true;

      socket.emit('submit_answer', { choiceIdx: idx });

      const buttons = document.querySelectorAll('#playerChoices button');
      buttons.forEach((b, i) => {
        b.disabled = true;
        b.classList.add('opacity-40', 'cursor-not-allowed');
        b.classList.remove('active:scale-95');
        if (i === idx) {
          b.classList.remove('opacity-40');
          b.classList.add('border-orange-500', 'bg-orange-500/20', 'text-orange-400');
        }
      });
      document.getElementById('submissionState').textContent = 'Answer locked! Waiting for host...';
    }

    function lockOptionsOnExpiry() {
      if (hasSubmitted) return;
      hasSubmitted = true;

      document.getElementById('expireBanner').classList.remove('hidden');
      document.getElementById('submissionState').textContent = 'You did not answer in time.';
      document.getElementById('submissionState').classList.add('text-red-400');

      const buttons = document.querySelectorAll('#playerChoices button');
      buttons.forEach(b => {
        b.disabled = true;
        b.classList.add('opacity-40', 'cursor-not-allowed');
      });
    }

    socket.on('question_expired', () => {
      clearInterval(timerInterval);
      lockOptionsOnExpiry();
    });
  </script>
</body>
</html>
